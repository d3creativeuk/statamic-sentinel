name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.lock isn't committed, so each PHP version resolves the newest
        # Statamic / Laravel / Testbench / PHPUnit it supports: PHP 8.0 lands on
        # Statamic 3.x with Laravel 9 and PHPUnit 9, 8.3+ on Statamic 6.
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      # Composer 2.9+ refuses to install package versions with known security
      # advisories. PHP 8.0 and 8.1 can only resolve Testbench 7 / Laravel 9,
      # every release of which now has advisories, so nothing would install.
      # These are dev dependencies for the test run only; sites installing the
      # addon never get them.
      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit
