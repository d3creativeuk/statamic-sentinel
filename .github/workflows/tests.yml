name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Statamic ${{ matrix.statamic }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.lock isn't committed, so each leg resolves the newest
        # Laravel / Testbench / PHPUnit its PHP and Statamic major allow.
        # Without the statamic axis every leg would resolve Statamic 6, and
        # nothing would test Statamic 5.
        php: ['8.2', '8.3', '8.4', '8.5']
        statamic: ['^5.0', '^6.0']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Pin the Statamic major
        run: composer require "statamic/cms:${{ matrix.statamic }}" --no-update --no-interaction

      # Every installable Statamic 5 release requires ueberdosis/tiptap-php
      # ^1.4, and its only 1.x release has an advisory with no fix, so
      # Composer's security blocking refuses it. Ignore that one advisory on
      # the Statamic 5 legs; every other advisory and malware check still
      # blocks.
      - name: Allow tiptap-php 1.x (Statamic 5 only)
        if: matrix.statamic == '^5.0'
        run: composer config audit.ignore --json '{"PKSA-52qp-479k-9x2j": "tiptap-php 1.x has no fixed release; every Statamic 5 release requires it"}'

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit
